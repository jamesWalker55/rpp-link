[package]
name = "rpp-link"
version = "0.1.0"
edition = "2024"

[dependencies]
base64-simd = "0.8.0"
bitflags = "2.13.1"
itertools = "0.15.0"
jiff = "0.2.35"
pico-args = "0.5.0"
regex = "1.13.1"
rpp-parser = { git = "https://github.com/jamesWalker55/rpp-parser.git", rev = "197e07c85e277387879887f56c99a482d4da78f5" }
serde_json = "1.0"
smallvec = "1.15.2"
urlencoding = "2.1.3"
walkdir = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

